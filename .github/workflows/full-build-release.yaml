name: Full Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Set up TeX Live
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: '2025'
          run: bash ./fullbuild.sh

      - name: Fix ownership and permissions (workspace)
        run: |
          sudo chown -R $(id -u):$(id -g) "$GITHUB_WORKSPACE"
          sudo chmod -R u+rwX "$GITHUB_WORKSPACE"

      - name: Copy PDF files
        run: |
          cp 184429/main.pdf 184429/184429.pdf
          cp 188752/main.pdf 188752/188752.pdf
          cp 193331/main.pdf 193331/193331.pdf
          cp 193552/main.pdf 193552/193552.pdf

      - name: Generate release tag
        id: generate_release_tag
        uses: amitsingh-007/next-release-tag@v6.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: 'v'
          tag_template: 'yyyy.mm.dd.i'
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.generate_release_tag.outputs.next_release_tag }}
          tag_name: ${{ steps.generate_release_tag.outputs.next_release_tag }}
          make_latest: true
          generate_release_notes: true
          files: |
            184429/184429.pdf
            188752/188752.pdf
            193331/193331.pdf
            193552/193552.pdf
